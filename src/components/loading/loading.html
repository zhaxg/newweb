  #app-loading.hidden {
    pointer-events: none;

    opacity: 0;

    0% {
      transform: translateX(-25%);
    }

    100% {
      transform: translateX(25%);
    }

    opacity: 0.5;
    position: fixed;
    z-index: -1;
  }

  .mud-wasm-cont {
    left: 50%;
    padding: 10vmin;
    position: fixed;
    text-align: center;
    top: 50%;
    transform: translate(-50%, -50%);
  }
